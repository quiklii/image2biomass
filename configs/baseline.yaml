project:
  name: biomass2prediction
  seed: 7
  run_name: effnet_b2_baseline

data:
  images_root: data/train
  train_csv: data/train_split.csv
  valid_csv: data/val_split.csv

  target_names:
    - Dry_Clover_g
    - Dry_Green_g
    - Dry_Dead_g

  image_size: [256, 256]

dataloader:
  batch_size: 32
  num_workers: 4

model:
  backbone: efficientnet_b2
  pretrained: true

train:
  epochs: 10
  lr: 0.0003
  weight_decay: 0.0001
  output_dir: outputs/runs

loss: mse

optimizer: adamw
